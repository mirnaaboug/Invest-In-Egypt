# Deploys database changes and server functions to Supabase.
# Runs only when you start it: Actions → "Deploy Supabase backend" → Run workflow.
#
# One-time setup, in GitHub: Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_ACCESS_TOKEN  a personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password (Supabase → Project settings → Database)
name: Deploy Supabase backend

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to deploy"
        type: choice
        options: [functions, database, both]
        default: functions

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: sobptlqqazhcfooytqav
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first."; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" ${SUPABASE_DB_PASSWORD:+--password "$SUPABASE_DB_PASSWORD"}

      - name: Apply database migrations
        if: ${{ inputs.what == 'database' || inputs.what == 'both' }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::error::Add the SUPABASE_DB_PASSWORD repository secret to deploy the database."; exit 1; fi
          supabase db push --include-all

      - name: Deploy server functions
        if: ${{ inputs.what == 'functions' || inputs.what == 'both' }}
        run: |
          supabase functions deploy create-checkout --project-ref "$PROJECT_REF"
          supabase functions deploy billing-portal --project-ref "$PROJECT_REF"
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
