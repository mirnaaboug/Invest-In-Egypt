# Supabase CLI settings for the Egypt Gateway backend.
# Project: Egypt Trade Gateway (London) — https://supabase.com/dashboard/project/sobptlqqazhcfooytqav
project_id = "sobptlqqazhcfooytqav"

[auth]
site_url = "https://mirnaaboug.github.io/Invest-In-Egypt/"
additional_redirect_urls = [
  "https://mirnaaboug.github.io/Invest-In-Egypt/",
  "https://mirnaaboug.github.io/Invest-In-Egypt/admin/",
  "http://localhost:8000/"
]

[functions.create-checkout]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true

# Stripe signs these requests itself, so Supabase must not ask for a login token.
[functions.stripe-webhook]
verify_jwt = false
